<div class="space-y-4 text-lg">
  <p><b>Type:</b> {{ report.type.title }}</p>
  <p><b>Strategy:</b> {{ report.strategy.title }}</p>
  <p><b>Authority:</b> {{ report.authority.title }}</p>
  <p><b>Profile:</b> {{ report.profile.title }}</p>

  <h4 className="text-xl font-semibold">Active Channels</h4>
  <ul>
    <li *ngFor="let c of report.channels" class="justify-center items-center">
      <span class=" text-xl font-bold">{{ c.key }}</span> {{ c.title }}
    </li>
  </ul>

</div>
