<div class="min-h-screen flex flex-col">
  <!-- Navbar -->
  <header class="border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a routerLink="/" class="text-xl font-bold text-emerald-600">
        Human Design
      </a>

      <nav class="space-x-6 text-sm font-medium">
        <a routerLink="/admin/dashboard"
         class="px-3 py-2 rounded-lg hover:bg-emerald-800 hover:text-white">
          Dashboard
        </a>

        <a *ngIf="role==='Admin'"
          routerLink="/admin/cms"
          class="px-3 py-2 rounded-lg hover:bg-emerald-800 hover:text-white">
          CMS
        </a>

        <a *ngIf="role!=='User'"
          routerLink="/admin/crm"
          class="px-3 py-2 rounded-lg hover:bg-emerald-800">
          CRM
        </a>

        <a *ngIf="role==='Admin'"
          routerLink="/admin/users"
          class="px-3 py-2 rounded-lg hover:bg-emerald-800">
          Users
        </a>

        <button
          (click)="logout()"
          class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700">
          Logout
        </button>
      </nav>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto p-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-50 border-t border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-6 text-sm text-gray-500 flex justify-between">
      <div>© 2026 Human Design Platform</div>
      <div>Built with AI + Human Design Engine</div>
    </div>
  </footer>
</div>
