<div class="p-6 max-w-7xl mx-auto">

    <h2 class="text-2xl font-bold mb-4">Edit Agent</h2>

    <form [formGroup]="form" class="grid gap-6" (ngSubmit)="save()">

      <div class="grid grid-cols-8 items-center gap-4">
        <label>Full Name</label>
        <input formControlName="fullName" class="border p-3 rounded-lg col-span-7"/>
      </div>

      <div class="grid grid-cols-8 items-center gap-4">
        <label>Email</label>
        <input formControlName="email" readonly class="border p-3 rounded-lg col-span-7"/>
      </div>

      <div class="grid grid-cols-8 items-center gap-4">
        <label>Role</label>
        <select formControlName="role" class="border p-3 rounded-lg col-span-7">
          <option value="Agent">Agent</option>
          <option value="Leader">Leader</option>
        </select>
      </div>

      <div class="grid grid-cols-8 items-center gap-4">
        <label>Parent Leader</label>
        <select formControlName="parentId" class="border p-3 rounded-lg col-span-7">
          <option value="">None</option>

          <option *ngFor="let l of leaders" [value]="l.id">
            {{ l.fullName }}
          </option>

        </select>
      </div>

      <button type="submit" class="bg-emerald-600 text-white py-3 rounded-xl font-semibold hover:bg-emerald-700">Save</button>

    </form>

  </div>
