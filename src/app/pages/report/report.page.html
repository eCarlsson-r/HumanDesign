<div class="report-container" *ngIf="report">

  <!-- PAGE 1 -->
  <section class="report-page">
    <hd-report-header [report]="report"></hd-report-header>
    <hd-bodygraph [report]="report"></hd-bodygraph>
    <hd-report-summary [report]="report"></hd-report-summary>
  </section>

  <!-- PAGE 2 -->
  <section class="report-page">
    <hd-report-centers [centers]="report.centerDefinitions"></hd-report-centers>
    <hd-report-channels [channels]="report.channels"></hd-report-channels>
  </section>

</div>
